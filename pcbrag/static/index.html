<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCB doc assistant</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --text:#1c2230; --muted:#667085; --accent:#0f7b6c;
          --border:#dfe3ea; --me:#e7f4f1; --code:#f0f2f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --panel:#1b2029; --text:#e4e7ee; --muted:#98a2b3; --accent:#3cc1a8;
            --border:#2c3340; --me:#173029; --code:#232a35; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg);
         color: var(--text); display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 1.1rem; margin: 0; }
  header span { color: var(--muted); font-size: .85rem; }
  #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: var(--panel);
         border: 1px solid var(--border); white-space: pre-wrap; line-height: 1.45; }
  .me { background: var(--me); border-color: transparent; margin-left: 15%; }
  .sources { margin-top: 10px; font-size: .82rem; color: var(--muted); }
  .sources details { margin-top: 4px; }
  .sources summary { cursor: pointer; }
  .sources pre { background: var(--code); padding: 8px; border-radius: 6px; white-space: pre-wrap;
                 font-size: .8rem; color: var(--text); margin: 6px 0 0; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .examples button { background: var(--panel); border: 1px solid var(--border); color: var(--text);
                     border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: .85rem; }
  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border);
         background: var(--panel); max-width: 860px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
          background: var(--bg); color: var(--text); font-size: 1rem; }
  form button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent);
                color: #fff; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header><h1>PCB doc assistant</h1><span id="status"></span></header>
<div id="log">
  <div class="examples" id="examples"></div>
</div>
<form id="f">
  <input id="q" placeholder="ask about a datasheet or a test log..." autocomplete="off">
  <button>Ask</button>
</form>
<script>
const EXAMPLES = [
  "What is the absolute maximum input voltage of the AX3318?",
  "Why did board CB-24-00127 fail?",
  "Which test step fails most often?",
  "What inductor should I use with the BK1210 for 1.2 V?",
];
const log = document.getElementById("log");
const history = [];

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function escape(s) {
  return s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
}

async function ask(question) {
  document.getElementById("examples").remove?.();
  add(question, "me");
  const box = add("...");
  try {
    const res = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({question, history})});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
    box.textContent = data.answer;
    history.push([question, data.answer]);
    const src = document.createElement("div");
    src.className = "sources";
    src.innerHTML = data.sources.map(s =>
      `<details><summary>[${s.n}] ${escape(s.where)}</summary><pre>${escape(s.snippet)}</pre></details>`).join("");
    box.appendChild(src);
  } catch (e) {
    box.textContent = "error: " + e.message;
  }
}

document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById("q");
  if (q.value.trim()) ask(q.value.trim());
  q.value = "";
};

const ex = document.getElementById("examples");
EXAMPLES.forEach(t => {
  const b = document.createElement("button");
  b.textContent = t;
  b.onclick = () => ask(t);
  ex.appendChild(b);
});

fetch("/api/health").then(r => r.json()).then(h => {
  document.getElementById("status").textContent =
    `retriever: ${h.retriever} · ${h.llm ? "Azure OpenAI" : "no LLM (passages only)"}`;
});
</script>
</body>
</html>
